    // LISTENER EN TIEMPO REAL (CITAS Y CUENTAS)
    function initRealtimeListener() {
      if (isFirebaseActive && firebase.database) {

        dbRefCitas.on('child_added', (snapshot) => {
          const newApp = snapshot.val();

            appointments.push(newApp);
            localStorage.setItem('spa_appointments', JSON.stringify(appointments));
            renderAdminAppointments();
            checkAdminAlerts();
            triggerRealtimePopup(newApp);

        const dbRefCuentas = firebase.database().ref('cuentas');
        dbRefCuentas.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            paymentAccounts = Object.values(data);
            localStorage.setItem('spa_payment_accounts', JSON.stringify(paymentAccounts));
            renderClientPaymentAccounts();
            renderAdminAccountsList();
          }
        });

    function copyToClipboard(text) {
      const cleanNum = text.replace(/[^0-9]/g, '');
      const textToCopy = cleanNum.length > 5 ? cleanNum : text;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => showCopyToast());
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showCopyToast();
        } catch (err) {
          alert('Número: ' + textToCopy);
        }
        document.body.removeChild(textArea);
      }
    }

    function showCopyToast() {
      const toast = document.getElementById('copyToast');
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');

    }

      const activeSec = document.getElementById(`sec-${tabId}`);

      const bookedHours = appointments.filter(a => a.date === date).map(a => a.time);

        free.forEach(t => {

    function handleClientBooking(e) {
      e.preventDefault();
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      const serviceId = document.getElementById('clientService').value;
      const date = document.getElementById('clientDate').value;
      const time = document.getElementById('clientTime').value;
      const notes = document.getElementById('clientNotes').value.trim();

      const serviceObj = services.find(s => s.id === serviceId);
      if (!serviceObj) return;

      const newApp = {
        id: 'app_' + Date.now(),
        name,
        phone,
        service: serviceObj.name,
        date,
        time,
        deposit: 0,
        paymentStatus: 'Pendiente',
        notes: notes,
        adminNotes: ''
      };

      appointments.push(newApp);
      localStorage.setItem('spa_appointments', JSON.stringify(appointments));

      if (isFirebaseActive && firebase.database) {
        firebase.database().ref('citas/' + newApp.id).set(newApp);
      }

      const parts = date.split('-');
      const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;

      downloadAppointmentTicket(newApp, serviceObj, formattedDate);

      const text = `Hola, mi nombre es *${name}*. Acabo de agendar una cita para el servicio: *${serviceObj.name}* el día *${formattedDate}* a las *${time} hs*. Confirmo que acepté los requisitos y la política de puntualidad de 15 min antes. Quedo a la espera de enviar mi comprobante de anticipo ($${serviceObj.minDeposit || 0}). ✨🌻`;
      const waUrl = `https://wa.me/526674992354?text=${encodeURIComponent(text)}`;

      alert('¡Cita agendada con éxito! Se ha descargado la Ficha de Requisitos de tu cita. Serás redirigido a WhatsApp para confirmar.');
      window.open(waUrl, '_blank');

      e.target.reset();
      document.getElementById('serviceDetailBadge').classList.add('hidden');
      renderAdminAppointments();
      checkAdminAlerts();
    }

    // --- ADMINISTRADOR ---
    function setFilterStatus(statusType) {

      const btnPending = document.getElementById('btnFilterPending');

      btnToday.className = "px-3 py-1.5 bg-yellow-100 text-amber-950 font-bold text-xs rounded-lg border border-amber-300 transition-all";
      btnConfirmed.className = "px-3 py-1.5 bg-yellow-100 text-amber-950 font-bold text-xs rounded-lg border border-amber-300 transition-all";
      btnPending.className = "px-3 py-1.5 bg-yellow-100 text-amber-950 font-bold text-xs rounded-lg border border-amber-300 transition-all";

      if (statusType === 'all') btnAll.className = "px-3 py-1.5 bg-amber-500 text-amber-950 font-bold text-xs rounded-lg border border-amber-600 shadow-sm";
      if (statusType === 'today') btnToday.className = "px-3 py-1.5 bg-amber-500 text-amber-950 font-bold text-xs rounded-lg border border-amber-600 shadow-sm";
      if (statusType === 'confirmed') btnConfirmed.className = "px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-lg border border-emerald-700 shadow-sm";
      if (statusType === 'pending') btnPending.className = "px-3 py-1.5 bg-amber-600 text-white font-bold text-xs rounded-lg border border-amber-700 shadow-sm";

      renderAdminAppointments();
    }

    function renderAdminAppointments() {
      const container = document.getElementById('adminAppointmentsList');
      const search = document.getElementById('searchApp').value.toLowerCase();
      const dateInputFilter = document.getElementById('filterDate').value;
      const todayStr = new Date().toISOString().split('T')[0];

      let filtered = appointments.filter(a => {
        const matchSearch = a.name.toLowerCase().includes(search) || a.phone.includes(search);
        const matchDate = dateInputFilter ? a.date === dateInputFilter : true;
        
        let matchStatus = true;
        if (currentAdminFilter === 'today') {
          matchStatus = a.date === todayStr;
        } else if (currentAdminFilter === 'confirmed') {
          matchStatus = a.paymentStatus === 'Anticipo' || a.paymentStatus === 'Pagado Completo' || a.deposit > 0;
        } else if (currentAdminFilter === 'pending') {
          matchStatus = a.paymentStatus === 'Pendiente' && (a.deposit === 0 || !a.deposit);
        }

        return matchSearch && matchDate && matchStatus;
      });

      filtered.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-bg p-8 rounded-2xl border-2 border-amber-300 shadow-md text-center">
            <h3 class="text-base font-bold font-serif-title text-amber-950">No hay citas registradas con este filtro</h3>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(a => {
        const isToday = a.date === todayStr;
        const isConfirmed = a.paymentStatus === 'Anticipo' || a.paymentStatus === 'Pagado Completo' || a.deposit > 0;

        return `
          <div class="bg-white/95 backdrop-blur-md p-5 rounded-2xl border ${isToday ? 'border-amber-500 ring-2 ring-amber-400' : 'border-amber-200'} shadow-md space-y-3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-amber-100 pb-3">
              <div>
                <div class="flex items-center space-x-2">
                  <h3 class="font-bold text-amber-950 text-base">🌻 ${a.name}</h3>
                  ${isToday ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500 text-amber-950">HOY</span>' : ''}
                  ${isConfirmed ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">CONFIRMADA</span>' : '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">PENDIENTE</span>'}
                </div>
                <p class="text-xs text-amber-800 font-medium">WhatsApp: ${a.phone}</p>
              </div>

              <div class="flex items-center space-x-2">
                <button onclick="sendFollowUpWhatsApp('${a.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg flex items-center space-x-1 shadow-sm">
                  <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                  <span>Enviar Seguimiento</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
              <div>
                <span class="text-amber-700 block font-bold">Servicio</span>
                <span class="font-bold text-amber-950">${a.service}</span>
              </div>
              
              <div>
                <span class="text-amber-700 block font-bold">Fecha & Hora (Editable)</span>
                <div class="flex items-center space-x-1 mt-0.5">
                  <input type="date" value="${a.date}" onchange="updateAppointmentDate('${a.id}', this.value)" class="text-xs font-bold border border-amber-300 rounded px-1.5 py-0.5 bg-yellow-50 text-amber-950 w-full">
                  <input type="time" value="${a.time}" onchange="updateAppointmentTime('${a.id}', this.value)" class="text-xs font-bold border border-amber-300 rounded px-1.5 py-0.5 bg-yellow-50 text-amber-950">
                </div>
              </div>

              <div>
                <span class="text-amber-700 block font-bold">Anticipo Registrado ($)</span>
                <input type="number" step="0.01" value="${a.deposit || 0}" onchange="updateDeposit('${a.id}', this.value)" class="w-full px-2 py-0.5 border border-amber-300 rounded font-bold text-emerald-800 bg-yellow-50 mt-0.5">
              </div>

              <div>
                <span class="text-amber-700 block font-bold">Estado de Pago</span>
                <select onchange="updatePaymentStatus('${a.id}', this.value)" class="w-full text-xs font-bold border border-amber-300 rounded px-1 py-0.5 bg-yellow-50 mt-0.5">
                  <option value="Pendiente" ${a.paymentStatus === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                  <option value="Anticipo" ${a.paymentStatus === 'Anticipo' ? 'selected' : ''}>Anticipo Aceptado</option>
                  <option value="Pagado Completo" ${a.paymentStatus === 'Pagado Completo' ? 'selected' : ''}>Pagado Completo</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs bg-yellow-50/80 p-3 rounded-xl border border-amber-200">
              <div>
                <span class="text-amber-900 block font-bold">Notas del Cliente:</span>
                <p class="text-stone-700 italic">${a.notes || 'Sin notas del cliente.'}</p>
              </div>
              <div>
                <span class="text-amber-900 block font-bold">Notas del Administrador (Editables):</span>
                <input type="text" value="${a.adminNotes || ''}" onchange="updateAdminNotes('${a.id}', this.value)" placeholder="Escribir nota privada..." class="w-full px-2 py-1 text-xs border border-amber-300 rounded bg-white mt-1">
              </div>
            </div>

            <div class="flex justify-end space-x-3 border-t border-amber-100 pt-2 text-xs">
              <button onclick="deleteAppointment('${a.id}')" class="text-red-700 hover:text-red-900 font-bold flex items-center">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Eliminar Cita
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function updateAppointmentDate(id, newDate) {
      const app = appointments.find(a => a.id === id);
      if (app && newDate) {
        app.date = newDate;
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).update({ date: newDate });
        renderAdminAppointments();
        checkAdminAlerts();
      }
    }

    function updateAppointmentTime(id, newTime) {
      const app = appointments.find(a => a.id === id);
      if (app && newTime) {
        app.time = newTime;
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).update({ time: newTime });
        renderAdminAppointments();
        checkAdminAlerts();
      }
    }

    function updateDeposit(id, val) {
      const app = appointments.find(a => a.id === id);
      if (app) {
        app.deposit = parseFloat(val) || 0;
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).update({ deposit: app.deposit });
        renderAdminAppointments();
      }
    }

    function updateAdminNotes(id, val) {
      const app = appointments.find(a => a.id === id);
      if (app) {
        app.adminNotes = val;
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).update({ adminNotes: val });
      }
    }

    function sendFollowUpWhatsApp(id) {
      const app = appointments.find(a => a.id === id);
      if (!app) return;
      const cleanPhone = app.phone.replace(/\D/g, '');
      const parts = app.date.split('-');
      const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;

      const text = `Hola, buenos días ${app.name} 🌻. Te hablamos del *Spa de Damaris Vega*. Veo que estás interesado(a) en nuestro servicio de *${app.service}* para la fecha *${formattedDate}* a las *${app.time} hs*. Te contactamos para confirmar tu asistencia y brindarte los detalles de tu cita. Recuerda estar 15 min antes. ✨💆‍♀️`;
      window.open(`https://wa.me/52${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function updatePaymentStatus(id, newStatus) {
      const app = appointments.find(a => a.id === id);
      if (app) {
        app.paymentStatus = newStatus;
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).update({ paymentStatus: newStatus });
        renderAdminAppointments();
      }
    }

    function deleteAppointment(id) {
      if (confirm('¿Eliminar cita del registro?')) {
        appointments = appointments.filter(a => a.id !== id);
        localStorage.setItem('spa_appointments', JSON.stringify(appointments));
        if (isFirebaseActive && firebase.database) firebase.database().ref('citas/' + id).remove();
        renderAdminAppointments();
        checkAdminAlerts();
      }
    }

    // --- SERVICIOS ADMIN ---
    function renderAdminServicesList() {
      const container = document.getElementById('adminServicesList');
      container.innerHTML = services.map(s => `
        <div class="p-4 bg-white/90 rounded-xl border border-amber-300 shadow-sm flex flex-col justify-between space-y-2">
          <div>
            <div class="flex justify-between items-start">
              <h4 class="font-bold text-amber-950">🌻 ${s.name}</h4>
              <span class="text-xs font-extrabold text-amber-950 bg-yellow-300 px-2 py-0.5 rounded-md">$${parseFloat(s.price).toFixed(2)}</span>
            </div>
            <p class="text-xs text-stone-600 mt-1">${s.desc || 'Sin descripción'}</p>
            <div class="text-xs text-amber-900 font-bold mt-2 space-y-1">
              <p>⏱ Duración: ${s.duration} min | 💵 Anticipo Mínimo: $${parseFloat(s.minDeposit || 0).toFixed(2)}</p>
              <p class="text-stone-500 font-normal italic">Requisitos: ${s.requirements || 'Ninguno'}</p>
            </div>
          </div>
          <div class="text-right border-t border-amber-100 pt-2">
            <button onclick="deleteService('${s.id}')" class="text-xs text-red-700 font-bold hover:underline">Eliminar</button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function saveService(e) {
      e.preventDefault();
      const name = document.getElementById('serviceName').value.trim();
      const price = parseFloat(document.getElementById('servicePrice').value);
      const minDeposit = parseFloat(document.getElementById('serviceMinDeposit').value) || 0;
      const duration = parseInt(document.getElementById('serviceDuration').value);
      const desc = document.getElementById('serviceDesc').value.trim();
      const requirements = document.getElementById('serviceRequirements').value.trim();

      services.push({ id: 's_' + Date.now(), name, price, minDeposit, duration, desc, requirements });
      localStorage.setItem('spa_services', JSON.stringify(services));

      e.target.reset();
      renderClientServicesSelect();
      renderClientCatalog();
      renderAdminServicesList();
    }

    function deleteService(id) {
      if (confirm('¿Eliminar servicio del catálogo?')) {
        services = services.filter(s => s.id !== id);
        localStorage.setItem('spa_services', JSON.stringify(services));
        renderClientServicesSelect();
        renderClientCatalog();
        renderAdminServicesList();
      }
    }

    // --- CUENTAS ADMIN (SINCRONIZADAS EN TIEMPO REAL CON FIREBASE) ---
    function renderAdminAccountsList() {
      const container = document.getElementById('adminAccountsList');
      if (paymentAccounts.length === 0) {
        container.innerHTML = '<p class="text-xs text-amber-800 col-span-2">No hay cuentas configuradas.</p>';
        return;
      }

      container.innerHTML = paymentAccounts.map(acc => `
        <div class="p-4 bg-white/90 rounded-xl border border-amber-300 shadow-sm flex flex-col justify-between space-y-2">
          <div>
            <span class="text-xs font-bold text-amber-800 uppercase tracking-wider block">${acc.bank}</span>
            <p class="text-xs text-stone-600">Titular: <span class="font-bold text-amber-950">${acc.owner}</span></p>
            <p class="text-xs font-mono font-bold text-amber-900 mt-1">${acc.number}</p>
            ${acc.notes ? `<p class="text-xs text-stone-500 italic mt-1">${acc.notes}</p>` : ''}
          </div>
          <div class="text-right border-t border-amber-100 pt-2">
            <button onclick="deletePaymentAccount('${acc.id}')" class="text-xs text-red-700 font-bold hover:underline">Eliminar Cuenta</button>
          </div>
        </div>
      `).join('');
    }

    function savePaymentAccount(e) {
      e.preventDefault();
      const bank = document.getElementById('accBank').value.trim();
      const owner = document.getElementById('accOwner').value.trim();
      const number = document.getElementById('accNumber').value.trim();
      const notes = document.getElementById('accNotes').value.trim();

      const newAccount = { id: 'acc_' + Date.now(), bank, owner, number, notes };
      paymentAccounts.push(newAccount);
      localStorage.setItem('spa_payment_accounts', JSON.stringify(paymentAccounts));

      if (isFirebaseActive && firebase.database) {
        firebase.database().ref('cuentas/' + newAccount.id).set(newAccount);
      }

      e.target.reset();
      renderClientPaymentAccounts();
      renderAdminAccountsList();
    }

    function deletePaymentAccount(id) {
      if (confirm('¿Deseas eliminar esta cuenta de pago?')) {
        paymentAccounts = paymentAccounts.filter(a => a.id !== id);
        localStorage.setItem('spa_payment_accounts', JSON.stringify(paymentAccounts));

        if (isFirebaseActive && firebase.database) {
          firebase.database().ref('cuentas/' + id).remove();
        }

        renderClientPaymentAccounts();
        renderAdminAccountsList();
      }
    }

    function checkAdminAlerts() {
      if (!isAdminLoggedIn) return;
      const todayStr = new Date().toISOString().split('T')[0];
      const todayApps = appointments.filter(a => a.date === todayStr);

      const banner = document.getElementById('alertBannerAdmin');
      const text = document.getElementById('alertBannerText');

      if (todayApps.length > 0) {
        text.innerText = `Tienes ${todayApps.length} persona(s) agendada(s) para hoy.`;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }
  </script>
